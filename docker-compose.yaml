version: "3.8"

services:
    mysql:
        image: mysql
        container_name: mysql
        ports:
            - 3306:3306
        environment:
            MYSQL_ROOT_PASSWORD: Test@123
            MYSQL_DATABASE: BankDB
        networks:
            - bankapp
        volumes:
            - mysql-data:/var/lib/mysql
        restart: always
        healthcheck:
            #test: ["CMD", "mysql", "-u", "root", "-padmin, "-e", "SELECT 1;"]
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pTest@123"]
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 60s
    
    bankapp:
        image: devops850000/springboot-bankapp:latest
        container_name: BankApp
        ports:
            - 8080:8080
        environment:
            SPRING_DATASOURCE_USERNAME: root
            SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/BankDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            SPRING_DATASOURCE_PASSWORD: Test@123
        networks:
            - bankapp
        depends_on:
            - mysql
        restart: always
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8080/"]
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 60s

        
        
        



volumes:
    mysql-data:
networks:
    bankapp:
